#ref https://github.com/Azure-Samples/terraform-github-actions/blob/main/.github/workflows/tf-plan-apply.yml

on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string
      installKubelogin:
        type: boolean
        default: false
      diagnoseKubelogin:
        type: boolean
        default: false
        description: "Temporarily diagnose kubelogin during plan without logging credentials. Logs only output metadata; rejects malformed credential output and suppresses raw stderr."
      deployfrombranch:
        type: string
        default: "refs/heads/main"
      armClientIdPlan:
        type: string
        default: "8af69662-81b6-4ce6-99f9-9d4d3d43c436" # Default value for terraform-plan
      armClientIdApply:
        type: string
        default: "8af69662-81b6-4ce6-99f9-9d4d3d43c436" # Default value for terraform-apply
      environmentPlan:
        type: string
        default: "azure-platform-tf-plan" # Default environment for terraform-plan
      environmentApply:
        type: string
        default: "azure-platform-tf-apply" # Default environment for terraform-apply
      skipStateRefresh:
        type: boolean
        default: false
        description: "Skip state refresh during plan to improve performance when state is known to be current"
      setupManagedGrafanaAuth:
        type: boolean
        default: false
        description: "Setup Grafana authentication for Azure Managed Grafana by retrieving an access token using the Azure CLI and setting it as an environment variable for use in Terraform"
    secrets:
      APP_PEM_FILE:
        required: false
      BETTERUPTIME_API_TOKEN:
        required: false
      ARGO_CD_GITHUB_APP_ID:
        required: false
      ARGO_CD_GITHUB_APP_INSTALLATION_ID:
        required: false
      ARGO_CD_GITHUB_APP_PRIVATE_KEY:
        required: false
      ACR_CACHE_DOCKER_USERNAME:
        required: false
      ACR_CACHE_DOCKER_PASSWORD:
        required: false

      # secret for copilot-usage-dashboard application
      GH_APP_ND_COPILOT_USAGE_DASHBOARD_PRIVATE_KEY:
        required: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write
  actions: read

env:
  # These environment variables are used by the terraform azure provider to setup OIDD authenticate.
  ARM_SUBSCRIPTION_ID: "fda77453-b07b-4860-b1cc-dd8365592842"
  ARM_TENANT_ID: "5546488e-16ae-4971-ba91-b12a928efaf8"

  # USED FOR tf authentication to github app
  GITHUB_APP_ID: ${{ vars.APP_ID }}
  GITHUB_APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
  GITHUB_APP_PEM_FILE: ${{ secrets.APP_PEM_FILE }}

  # USED for betterstack
  BETTERUPTIME_API_TOKEN: ${{ secrets.BETTERUPTIME_API_TOKEN }}

jobs:
  # tflint:
  #   uses: ./.github/workflows/tflint-scan.yml
  #   with:
  #     path: ${{ inputs.path }}
  #     compare-branch: main
  #     repository: ${{ github.repository }}

  # tfsec:
  #   uses: ./.github/workflows/trivy-scan.yml
  #   with:
  #     path: ${{ inputs.path }}
  #     compare-branch: main
  #     repository: ${{ github.repository }}
  #     scan-type: "config"
  #     severity: "LOW,MEDIUM,HIGH,CRITICAL"
  #     skip-files: "terraform/alz/import-amba.tf"

  terraform-plan:
    runs-on: private-ubuntu-runner
    environment: ${{ inputs.environmentPlan }}
    env:
      # Argo-cd GitHub application credentials, used by argo-cd in nd-management, nd-shared-non-prod and nd-shared-prod to sync with the GitHub repository
      TF_VAR_argo_cd_github_app_id: ${{ secrets.ARGO_CD_GITHUB_APP_ID }}
      TF_VAR_argo_cd_github_app_installation_id: ${{ secrets.ARGO_CD_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_argo_cd_github_app_private_key: ${{ secrets.ARGO_CD_GITHUB_APP_PRIVATE_KEY }}

      # ACR cache docker credentials
      TF_VAR_acr_cache_docker_username: ${{ secrets.ACR_CACHE_DOCKER_USERNAME }}
      TF_VAR_acr_cache_docker_password: ${{ secrets.ACR_CACHE_DOCKER_PASSWORD }}

      # secret for copilot-usage-dashboard application
      TF_VAR_gh_app_nd_copilot_usage_dashboard_private_key: ${{ secrets.GH_APP_ND_COPILOT_USAGE_DASHBOARD_PRIVATE_KEY }}
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}
      terraform-version: ${{ steps.tf-required-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Set ARM_CLIENT_ID for terraform-plan
      - name: Set ARM_CLIENT_ID for Plan
        run: echo "ARM_CLIENT_ID=${{ inputs.armClientIdPlan }}" >> $GITHUB_ENV

      # Azure Login for DefaultAzureCredential support
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.armClientIdPlan }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          allow-no-subscriptions: true

      # Set Grafana authentication token for Azure Managed Grafana
      - name: Set Grafana Auth
        if: ${{ inputs.setupManagedGrafanaAuth == true }}
        run: |
          GRAFANA_TOKEN=$(az account get-access-token --resource ce34e7e5-485f-4d76-964f-b3d2b16d1e4f --query accessToken -o tsv)
          echo "GRAFANA_AUTH=$GRAFANA_TOKEN" >> $GITHUB_ENV

      - name: Find required Terraform version
        id: tf-required-version
        run: |
          version=$(grep -h 'required_version' ${{ inputs.path }}/*.tf | head -1 | sed -E "s/.*required_version *= *['\"]?([^'\"]*)['\"]?.*/\1/")
          if [ -z "$version" ]; then
            version="latest" # fallback to desired default
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install kubelogin
        if: ${{ inputs.installKubelogin == true }}
        uses: azure/use-kubelogin@v1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-required-version.outputs.version }}

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ inputs.path }}

      # Validate terraform files
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ inputs.path }}

      - name: Enable Token-Safe Kubelogin Diagnostics
        if: ${{ inputs.diagnoseKubelogin }}
        shell: bash
        run: |
          set -euo pipefail
          real_kubelogin=$(command -v kubelogin)
          echo "Resolved kubelogin: $real_kubelogin"
          type -a -p kubelogin
          readlink -f "$real_kubelogin"
          sha256sum "$real_kubelogin"
          "$real_kubelogin" --version
          node --version
          diagnostics_dir=$(mktemp -d "$RUNNER_TEMP/kubelogin-diagnostics.XXXXXX")
          cat > "$diagnostics_dir/kubelogin" <<'NODE'
          #!/usr/bin/env node
          const { spawnSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');

          const result = spawnSync(
            process.env.KUBELOGIN_DIAGNOSTIC_REAL_BINARY,
            process.argv.slice(2),
            { maxBuffer: 1024 * 1024 }
          );
          const stdout = result.stdout ?? Buffer.alloc(0);
          const stderr = result.stderr ?? Buffer.alloc(0);
          const text = stdout.toString('utf8');
          let credential;
          let jsonValid = false;
          try {
            credential = JSON.parse(text);
            jsonValid = true;
          } catch (error) {
            if (!(error instanceof SyntaxError)) throw error;
          }
          const object = credential !== null
            && typeof credential === 'object'
            && !Array.isArray(credential);
          const kindValid = object && credential.kind === 'ExecCredential';
          const apiVersionValid = object && [
            'client.authentication.k8s.io/v1',
            'client.authentication.k8s.io/v1beta1'
          ].includes(credential.apiVersion);
          const tokenPresent = object
            && typeof credential.status?.token === 'string'
            && credential.status.token.length > 0;
          const summary = {
            exitCode: result.status,
            terminatedBySignal: result.signal !== null,
            spawnFailed: Boolean(result.error),
            stdoutBytes: stdout.length,
            stderrBytes: stderr.length,
            stdoutLines: text.length === 0 ? 0 : text.split('\n').length - Number(text.endsWith('\n')),
            startsWithJsonObject: text.trimStart().startsWith('{'),
            hasByteOrderMark: text.charCodeAt(0) === 0xfeff,
            hasAnsiEscapes: text.includes('\u001b['),
            jsonValid,
            kindValid,
            apiVersionValid,
            apiVersion: apiVersionValid ? credential.apiVersion : null,
            tokenPresent,
            aadstsCodes: [...new Set(stderr.toString('utf8').match(/\bAADSTS\d{5,}\b/g) ?? [])]
          };
          const record = `${JSON.stringify(summary)}\n`;
          appendFileSync(process.env.KUBELOGIN_DIAGNOSTIC_LOG, record, { mode: 0o600 });
          process.stderr.write(`[kubelogin-diagnostics] ${record}`);
          if (result.error || result.signal !== null || result.status !== 0) {
            process.exit(result.status > 0 ? result.status : 1);
          }
          if (!jsonValid || !kindValid || !apiVersionValid || !tokenPresent) {
            process.stderr.write('[kubelogin-diagnostics] Invalid credential output; raw stdout/stderr withheld.\n');
            process.exit(1);
          }
          process.stdout.write(stdout);
          NODE
          chmod 700 "$diagnostics_dir/kubelogin"
          echo "KUBELOGIN_DIAGNOSTIC_REAL_BINARY=$real_kubelogin" >> "$GITHUB_ENV"
          echo "KUBELOGIN_DIAGNOSTIC_LOG=$diagnostics_dir/metadata.jsonl" >> "$GITHUB_ENV"
          echo "$diagnostics_dir" >> "$GITHUB_PATH"

      # Generates an execution plan for Terraform
      # An exit code of 0 indicated no changes, 1 a terraform failure, 2 there are pending changes.
      - name: Terraform Plan
        id: tf-plan
        run: |
          if [ "${{ inputs.skipStateRefresh }}" = "true" ]; then
            terraform plan -detailed-exitcode -no-color -out tfplan -refresh=false
            echo "⚡ State refresh skipped for faster execution"
          else
            terraform plan -detailed-exitcode -no-color -out tfplan
          fi
        working-directory: ${{ inputs.path }}

      - name: Print Token-Safe Kubelogin Diagnostics
        if: ${{ always() && inputs.diagnoseKubelogin }}
        shell: bash
        run: |
          if [[ -n "${KUBELOGIN_DIAGNOSTIC_LOG:-}" && -f "$KUBELOGIN_DIAGNOSTIC_LOG" ]]; then
            cat "$KUBELOGIN_DIAGNOSTIC_LOG"
          else
            echo "::warning::No kubelogin diagnostic metadata was captured."
          fi

      # Save plan to artifacts
      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ inputs.path }}/tfplan

      # Publish Terraform Plan as task summary
      - name: Publish Terraform Plan to Task Summary
        run: |
          TERRAFORM_PLAN=$(terraform show -no-color tfplan)

          {
            echo "## Terraform Plan Output"
            echo "\`${{ inputs.path }}\`"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo '```terraform'
            echo "${TERRAFORM_PLAN}"
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          cat "${GITHUB_STEP_SUMMARY}" > ${{github.workspace}}/summary.md
        working-directory: ${{ inputs.path }}

      - name: Update PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && ( success() || failure() )
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const run_url = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID
            const run_link = '<a href="' + run_url + '">Actions</a>.'
            const commentIdentifier = "<!-- ACTION COMMENT TERRAFORM ${{ inputs.path }} -->"; // Unique identifier for the action comment
            const summary_string = commentIdentifier + "\n" + fs.readFileSync('${{github.workspace}}/summary.md', { encoding: 'utf8' });
            const summary = summary_string.length > 65000 ? summary_string.toString().substring(0, 65000) + " ... \n``` \n</details>Output is too long and was truncated. You can read full summary here: " + run_link + "<br /><br />" : summary_string

            // Get all comments for the pull request
            const comments =
              await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
              })

            // Filter out the comments that were previously created by this action
            const botComments = comments.data.filter(comment => comment.body.includes(commentIdentifier) && comment.user.type === "Bot");

            // Loop through previous comments to mark them as outdated
            for (const comment of botComments) {
              const minimizeCommentMutation = `
                mutation($subjectId: ID!, $classifier: ReportedContentClassifiers!) {
                  minimizeComment(input: {subjectId: $subjectId, classifier: $classifier}) {
                    minimizedComment {
                      isMinimized
                      minimizedReason
                    }
                  }
                }
              `;

              const variables = {
                subjectId: comment.node_id,  // Replace with the actual comment ID
                classifier: "OUTDATED"  // You can choose from the available classifiers
              };

              // Query graphql to minimize comment
              await github.graphql(minimizeCommentMutation, variables);
            }

            // Add a new comment to the PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })


  terraform-apply:
    name: "Terraform Apply"
    if: github.ref == inputs.deployfrombranch && needs.terraform-plan.outputs.tfplanExitCode == 2 #exitcode 2 indicates there are pending changes
    runs-on: private-ubuntu-runner
    environment: ${{ inputs.environmentApply }}
    env:
      # Argo-cd GitHub application credentials, used by argo-cd in nd-management, nd-shared-non-prod and nd-shared-prod to sync with the GitHub repository
      TF_VAR_argo_cd_github_app_id: ${{ secrets.ARGO_CD_GITHUB_APP_ID }}
      TF_VAR_argo_cd_github_app_installation_id: ${{ secrets.ARGO_CD_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_argo_cd_github_app_private_key: ${{ secrets.ARGO_CD_GITHUB_APP_PRIVATE_KEY }}

      # ACR cache docker credentials
      TF_VAR_acr_cache_docker_username: ${{ secrets.ACR_CACHE_DOCKER_USERNAME }}
      TF_VAR_acr_cache_docker_password: ${{ secrets.ACR_CACHE_DOCKER_PASSWORD }}

      # secret for copilot-usage-dashboard application
      TF_VAR_gh_app_nd_copilot_usage_dashboard_private_key: ${{ secrets.GH_APP_ND_COPILOT_USAGE_DASHBOARD_PRIVATE_KEY }}
    needs: [terraform-plan]
    # needs: [terraform-plan, tflint, tfsec]

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v7

      # Set ARM_CLIENT_ID for terraform-apply
      - name: Set ARM_CLIENT_ID for Apply
        run: echo "ARM_CLIENT_ID=${{ inputs.armClientIdApply }}" >> $GITHUB_ENV

      # Azure Login for DefaultAzureCredential support
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.armClientIdApply }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          allow-no-subscriptions: true

      # Set Grafana authentication token for Azure Managed Grafana
      - name: Set Grafana Auth
        if: ${{ inputs.setupManagedGrafanaAuth == true }}
        run: |
          GRAFANA_TOKEN=$(az account get-access-token --resource ce34e7e5-485f-4d76-964f-b3d2b16d1e4f --query accessToken -o tsv)
          echo "GRAFANA_AUTH=$GRAFANA_TOKEN" >> $GITHUB_ENV

      - name: Install kubelogin
        if: ${{ inputs.installKubelogin == true }}
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ needs.terraform-plan.outputs.terraform-version }}

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ inputs.path }}

      # Download saved plan from artifacts
      - name: Download Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: ${{ inputs.path }}

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ inputs.path }}
