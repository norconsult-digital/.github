name: .NET CD Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      environmentName:
        required: true
        type: string
      allowedBranches:
        required: false
        default: '["main"]'
        type: string
      migrationBundleArguments:
        required: false
        default: ''
        type: string
      deploymentDelayInMinutes:
        required: false
        default: 0
        type: number
      artifactName:
        required: false
        default: 'container-image'
        type: string
      migrationBundleArtifactName:
        description: Name of the migrations bundle artifact. Must match migrationBundleArtifactName in dotnet-ci-jobs.
        required: false
        default: 'migrations-bundle'
        type: string
      repositoryName:
        required: true
        type: string
      azureServicePrincipalId:
        required: true
        type: string
      dbConnection: 
        required: false
        type: string
      appConfigurationEndpoint:
        description: "App Configuration store to read the migration connection from, e.g. https://appcs-nexus-common.azconfig.io. Used with dbConnectionKey, instead of dbConnection."
        required: false
        default: ''
        type: string
      dbConnectionKey:
        description: "Key in appConfigurationEndpoint that holds the connection. Read with environmentName as label."
        required: false
        default: ''
        type: string
      migrationCommandTimeout:
        description: "Seconds, added as Command Timeout to the connection read from App Configuration, for migrations that run longer than the app's own timeout. 0 adds nothing."
        required: false
        default: 0
        type: number
      migrationSummary:
        description: "Write a summary of migration command results by database. A successful command does not mean new migrations were applied."
        required: false
        default: false
        type: boolean
      dbConnections:
        description: "Multiple DB connections as JSON array"
        required: false
        default: "[]"
        type: string
      optionalDbConnection1: 
        required: false
        type: string
        description: "TEMPORARY: DO NOT USE OPTIONAL DB CONNECTIONS, THESE ARE TEMPORARY AND WILL BE REMOVED WITHOUT WARNING!"
      optionalDbConnection2:
        required: false
        type: string
        description: "TEMPORARY: DO NOT USE OPTIONAL DB CONNECTIONS, THESE ARE TEMPORARY AND WILL BE REMOVED WITHOUT WARNING!"
    outputs:
      imageTag:
        description: "Tag of the image pushed to ACR, e.g. test-1761055200"
        value: ${{ jobs.deploy.outputs.imageTag }}

permissions:
  id-token: write
  contents: read
  
jobs:
  delay_deployment:
    runs-on: ubuntu-latest    
    name: Delay deployment to ${{ inputs.environmentName }} for ${{ inputs.deploymentDelayInMinutes }} minutes 
    if: ${{ contains(fromJSON(inputs.allowedBranches), github.ref_name) || (startsWith(github.ref_name, 'release') && contains(fromJSON(inputs.allowedBranches), 'release')) }}
    steps:
      - name: Delay
        run: sleep ${{ inputs.deploymentDelayInMinutes }}m
  
  deploy:
    runs-on: private-ubuntu-runner
    environment: ${{ inputs.environment }}
    if: ${{ contains(fromJSON(inputs.allowedBranches), github.ref_name) || (startsWith(github.ref_name, 'release/') && contains(fromJSON(inputs.allowedBranches), 'release')) }}
    outputs:
      imageTag: ${{ steps.image_tag.outputs.imageTag }}
    steps:      
      - name: Determine ACR name and ACR subscription based on environment
        run: |
          if [ "${{ inputs.environmentName }}" = "prod" ] || [ "${{ inputs.environmentName }}" = "stage" ]; then
            echo "ACR_NAME=crndsharedprod.azurecr.io" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=a60c4c2a-c6d9-4940-85e5-bd1fa4a1dfea" >> $GITHUB_ENV
          else
            echo "ACR_NAME=crndsharednonprod.azurecr.io" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=21eca75c-ed74-4f47-9f51-c0c345a00859" >> $GITHUB_ENV
          fi

      - name: Log in with Azure
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azureServicePrincipalId }}
          tenant-id: '5546488e-16ae-4971-ba91-b12a928efaf8'
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}

      - name: Download migrations artifact
        if: ${{ inputs.migrationBundleArguments != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.migrationBundleArtifactName }}
          path: migrations-bundle

      - name: Prepare migration summary
        if: ${{ inputs.migrationBundleArguments != '' && inputs.migrationSummary }}
        run: |
          helper="$(mktemp "$RUNNER_TEMP/migration-summary.XXXXXXXX")"
          cat > "$helper" <<'HELPER'
          run_migration_with_summary() {
            local connection="$1" database status result
            if ! database="$(MIGRATION_CONNECTION="$connection" pwsh -NoLogo -NoProfile -NonInteractive -Command '
              try {
                $builder = [System.Data.Common.DbConnectionStringBuilder]::new()
                $builder.set_ConnectionString($env:MIGRATION_CONNECTION)
                $keys = @($builder.get_Keys() | Where-Object { $_ -in @("database", "initial catalog") })
                if ($keys.Count -ne 1) { exit 1 }
                $name = [string]$builder.get_Item($keys[0])
                if ($name -cnotmatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$") { exit 1 }
                [Console]::Write($name)
              } catch { exit 1 }
            ' 2>/dev/null)"; then
              echo "::warning::Could not safely determine the migration database name."
              database="unknown"
            fi
            if ./migrations-bundle.exe --connection "$connection" --verbose; then
              status=0
              result="Migration command completed; new migrations may not have been applied"
            else
              status=$?
              result="Migration command failed"
            fi
            if ! printf -- '- `%s`: %s (exit %s)\n' "$database" "$result" "$status" >> "$GITHUB_STEP_SUMMARY"; then
              echo "::warning::Could not write the migration summary."
            fi
            return "$status"
          }
          HELPER
          printf 'MIGRATION_SUMMARY_HELPER=%s\n' "$helper" >> "$GITHUB_ENV"

      - name: Set executable permission for migrations-bundle and run
        if: ${{ inputs.migrationBundleArguments != '' && inputs.dbConnection != '' }}
        env:
          CONNECTION: ${{ inputs.dbConnection }}
          MIGRATION_SUMMARY: ${{ inputs.migrationSummary }}
        run: |
          chmod +x ./migrations-bundle.exe
          if [ "$MIGRATION_SUMMARY" = "true" ]; then
            source "$MIGRATION_SUMMARY_HELPER"
            run_migration_with_summary "$CONNECTION"
          else
            ./migrations-bundle.exe --connection "$CONNECTION" --verbose
          fi
        working-directory: ./migrations-bundle  

      - name: Run migrations with the connection from App Configuration
        if: ${{ inputs.migrationBundleArguments != '' && inputs.dbConnectionKey != '' }}
        env:
          ENDPOINT: ${{ inputs.appConfigurationEndpoint }}
          KEY: ${{ inputs.dbConnectionKey }}
          LABEL: ${{ inputs.environmentName }}
          TIMEOUT: ${{ inputs.migrationCommandTimeout }}
          MIGRATION_SUMMARY: ${{ inputs.migrationSummary }}
        run: |
          set -euo pipefail
          connection="$(az appconfig kv show --endpoint "$ENDPOINT" --auth-mode login --key "$KEY" --label "$LABEL" --query value -o tsv)"
          if [ -z "$connection" ]; then
            echo "::error::$KEY has no value for label $LABEL in $ENDPOINT"
            exit 1
          fi
          echo "::add-mask::$connection"
          if [ "$TIMEOUT" != "0" ]; then connection="${connection%;};Command Timeout=$TIMEOUT;"; fi
          chmod +x ./migrations-bundle.exe
          if [ "$MIGRATION_SUMMARY" = "true" ]; then
            source "$MIGRATION_SUMMARY_HELPER"
            run_migration_with_summary "$connection"
          else
            ./migrations-bundle.exe --connection "$connection" --verbose
          fi
        working-directory: ./migrations-bundle

      - name: Run migrations for multiple DB connections
        if: ${{ inputs.migrationBundleArguments != '' && inputs.dbConnections != '[]' }}
        env:
          DB_CONNECTIONS: ${{ inputs.dbConnections }}
          MIGRATION_SUMMARY: ${{ inputs.migrationSummary }}
        run: |
          chmod +x ./migrations-bundle.exe
          if [ "$MIGRATION_SUMMARY" = "true" ]; then
            source "$MIGRATION_SUMMARY_HELPER"
          fi
          printf '%s\n' "$DB_CONNECTIONS" | jq -r '.[]' | while read -r connection; do
            if [ "$MIGRATION_SUMMARY" = "true" ]; then
              run_migration_with_summary "$connection"
            else
              ./migrations-bundle.exe --connection "$connection" --verbose
            fi
          done
        working-directory: ./migrations-bundle

      # TEMPORARY: DO NOT USE OPTIONAL DB CONNECTIONS, THESE ARE TEMPORARY AND WILL BE REMOVED WITHOUT WARNING!"
      - name: Run migrations for optionalDbConnection1 if provided
        if: ${{ inputs.migrationBundleArguments != '' && inputs.optionalDbConnection1 != '' }}
        env:
          CONNECTION: ${{ inputs.optionalDbConnection1 }}
          MIGRATION_SUMMARY: ${{ inputs.migrationSummary }}
        run: |
          chmod +x ./migrations-bundle.exe
          if [ "$MIGRATION_SUMMARY" = "true" ]; then
            source "$MIGRATION_SUMMARY_HELPER"
            run_migration_with_summary "$CONNECTION"
          else
            ./migrations-bundle.exe --connection "$CONNECTION" --verbose
          fi
        working-directory: ./migrations-bundle
        
      # TEMPORARY: DO NOT USE OPTIONAL DB CONNECTIONS, THESE ARE TEMPORARY AND WILL BE REMOVED WITHOUT WARNING!"
      - name: Run migrations for optionalDbConnection2 if provided
        if: ${{ inputs.migrationBundleArguments != '' && inputs.optionalDbConnection2 != '' }}
        env:
          CONNECTION: ${{ inputs.optionalDbConnection2 }}
          MIGRATION_SUMMARY: ${{ inputs.migrationSummary }}
        run: |
          chmod +x ./migrations-bundle.exe
          if [ "$MIGRATION_SUMMARY" = "true" ]; then
            source "$MIGRATION_SUMMARY_HELPER"
            run_migration_with_summary "$CONNECTION"
          else
            ./migrations-bundle.exe --connection "$CONNECTION" --verbose
          fi
        working-directory: ./migrations-bundle
      
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifactName }}

      - name: Load Docker image
        run: docker load --input image.tar

      - name: Set Docker image tag
        id: image_tag
        run: |
          imageTag="${{ inputs.environmentName }}-$(date +%s)"
          echo "imageTag=$imageTag" >> $GITHUB_ENV
          echo "imageTag=$imageTag" >> $GITHUB_OUTPUT

      - name: Log in to the Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Retag Docker image
        run: |
          docker tag ${{ inputs.repositoryName }}:tmp ${{ env.ACR_NAME }}/${{ inputs.repositoryName }}:${{ env.imageTag }}

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.ACR_NAME }}/${{ inputs.repositoryName }}:${{ env.imageTag }}

      - name: Write deployment summary
        run: |
          echo "### ${{ inputs.repositoryName }} → ${{ inputs.environmentName }}" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.ACR_NAME }}/${{ inputs.repositoryName }}:${{ env.imageTag }}\`" >> $GITHUB_STEP_SUMMARY
