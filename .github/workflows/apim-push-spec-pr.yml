# Opens a pull request against the platform repository with a generated OpenAPI specification.
#
# This is the supported way for a team to get its API into APIM. The team's build produces a specification;
# this workflow puts it in Git and asks for it to be merged. APIOps publishes from there, to test, then stage,
# then prod, through the same mechanism each time.
#
# Replaces apim-push-openapi-v2.yml as the normal path. That one writes straight to an APIM instance, which
# means the change has already happened by the time anyone can see it, and each environment would be written
# by a different mechanism. It is kept for bootstrapping a new instance and for recovery. See ADR-0008 and
# docs/apim-external-api/04-openapi-fra-ipc.md in the platform repository.
#
# The caller owns specifications. It never writes an API's identity - path, display name, backend, product
# membership, policy - and never spells out a resource name: the target's preparation tool composes those
# from the module name and version date, so the naming rule lives in one place.
#
# Only Segment versioning is supported, with dated exports and /api/<date>/<resource> backend paths.
# The target's preparation tool generates specifications, dated API metadata, environment overrides,
# missing Segment version sets and product memberships from existing reviewed artifacts.
# A new *API* is not generated: its path, display name and product membership are a product
# decision, and a missing first version is an error with an instruction. That is the boundary - exposing an
# endpoint is a code change, exposing an API is a product decision.
#
# What the caller must have in place:
#
#   * A job that uploads an artifact named <API_NAME>-openapi with one <version>.json per explicit date
#     passed in VERSIONS. Unversioned proposals and implicit dates are not supported.
#   * tools/apim/prepare_segment_specifications.py in the target repository and existing baseline metadata
#     and environment URLs that satisfy the Segment convention. Query/Header sets are not migrated.
#   * The APIM Spec Proposer GitHub App installed on the target repository, its app id passed as
#     GITHUB_APP_ID and its private key as the APIM_SPEC_PR_APP_PRIVATE_KEY secret.
#
# The app can propose and nothing more. It holds contents and pull-requests write, but the target's main is
# protected and apimartifacts/** has CODEOWNERS, so a person still decides what merges. Write access cannot
# be narrowed to a single path - GitHub App permissions are per repository - so branch protection, not the
# token, is what actually holds.

name: "[APIM] Propose specification to platform"

on:
  workflow_call:
    inputs:
      API_NAME:
        required: true
        type: string
        description: >-
          The module's name, without any version - e.g. project-controls. Resource names are composed from
          this and the version date, so a caller never spells out a combined name.
      GITHUB_APP_ID:
        required: true
        type: string
        description: "App id of the APIM Spec Proposer app. Pass vars.APIM_SPEC_PR_APP_ID"
      TARGET_REPOSITORY:
        required: false
        type: string
        default: "platform"
        description: "Repository name holding apimartifacts, without the owner. Override only for a dry run"
      VERSIONS:
        required: true
        type: string
        description: >-
          Nonempty space-separated version dates, e.g. "2026-06-01 2026-12-01". Each is expected in the artifact as
          <version>.json, and its APIM resource name is composed as <API_NAME>--<version> per Rule 5b in
          ADR-0006. Only Segment versioning with /api/<date>/<resource> backend paths in apimartifacts is supported.
    secrets:
      APIM_SPEC_PR_APP_PRIVATE_KEY:
        required: true
    outputs:
      pull_request_url:
        value: ${{ jobs.propose-spec.outputs.pull_request_url }}
        description: "The pull request, or empty when all generated artifacts were unchanged"

# The contended resource is the branch apim-spec/<API_NAME> in the target repository. Every run recreates it
# from the default branch and force-pushes, so two runs at once meant the one that finished last won - which
# is not the same as the one that started last. A slow run carrying an older specification could quietly
# overwrite a newer one, and nothing failed. The second run could also lose the race to create the pull
# request and fail on a conflict that said nothing about the specification.
#
# Cancelled rather than queued, unlike the publisher in platform: a superseded proposal has no value, and the
# newest specification is the one that should reach review. Nothing outside git is written here, so a run
# stopped midway leaves at worst a branch whose pull request the next run opens.
#
# Keyed per target repository and API, so two teams proposing different APIs never wait for each other.
concurrency:
  group: apim-spec-${{ inputs.TARGET_REPOSITORY }}-${{ inputs.API_NAME }}
  cancel-in-progress: true

jobs:
  propose-spec:
    name: Propose specification
    runs-on: ubuntu-latest

    # Nothing is read from or written to the calling repository. The specification arrives as an artifact from
    # an earlier job in the same run, and everything else happens in the target repository under the app token.
    permissions:
      contents: read

    outputs:
      pull_request_url: ${{ steps.pull-request.outputs.url }}

    env:
      TARGET_FULL_NAME: ${{ github.repository_owner }}/${{ inputs.TARGET_REPOSITORY }}

    steps:
      # Scoped to the target repository and to the two permissions actually used, rather than to everything
      # the installation holds. The token also expires with the run.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.GITHUB_APP_ID }}
          private-key: ${{ secrets.APIM_SPEC_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.TARGET_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Download the specification
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.API_NAME }}-openapi
          path: spec

      - name: Check out the target repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_FULL_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          # The branch is recreated from the default branch on every run, so no older history is needed.
          fetch-depth: 1

      - name: Prepare Segment artifacts
        id: prepare
        shell: bash
        working-directory: target-repo
        env:
          API_NAME: ${{ inputs.API_NAME }}
          VERSIONS: ${{ inputs.VERSIONS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys

          def fail(message):
              sys.exit(f"::error::{message}")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"Duplicate JSON key in preparation manifest: {key}")
                  result[key] = value
              return result

          def read_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique_object,
                                    parse_constant=lambda value: fail(f"Invalid JSON constant: {value}"))
              except (OSError, ValueError) as error:
                  fail(f"Cannot read valid JSON from {path}: {error}")

          root = Path.cwd().resolve()
          api_name = os.environ["API_NAME"]
          versions = os.environ["VERSIONS"].split()
          if not versions:
              fail(f"Segment proposal for {api_name} requires nonempty explicit VERSIONS; unversioned proposals are not supported.")
          tool = root / "tools/apim/prepare_segment_specifications.py"
          if not tool.is_file():
              fail(f"Segment proposal for {api_name} requires the platform preparation tool at {tool}.")

          manifest = root / ".apim-preparation/changed-paths.json"
          try:
              subprocess.run([
                  sys.executable, str(tool), "--api-name", api_name,
                  "--export-directory", str(Path(os.environ["GITHUB_WORKSPACE"]) / "spec"),
                  "--versions", *versions, "--repository-root", ".",
                  "--changed-path-manifest", str(manifest),
              ], check=True)
          except subprocess.CalledProcessError as error:
              fail(f"Platform preparation failed for {api_name} (exit {error.returncode}); no raw-copy fallback. Review its diagnostic and existing Segment artifacts.")

          paths = read_json(manifest)
          if not isinstance(paths, list) or not paths or not all(isinstance(path, str) for path in paths):
              fail("Platform preparation must report a nonempty JSON array of exact Git paths.")
          if paths != sorted(set(paths)):
              fail("Platform preparation paths must be sorted and unique.")
          api_resources = {f"{api_name}--{version}" for version in versions}
          api_directories = {f"apimartifacts/apis/{resource}" for resource in api_resources}
          required = {f"{directory}/{name}" for directory in api_directories
                      for name in ("specification.json", "apiInformation.json")}
          required.add(f"apimartifacts/version sets/{api_name}/versionSetInformation.json")
          required.update(f"terraform/settings/apim/configuration.{environment}.yml"
                          for environment in ("test", "stage", "prod"))
          for path in paths:
              relative = PurePosixPath(path)
              parts = relative.parts
              product_file = (len(parts) == 6 and parts[:2] == ("apimartifacts", "products")
                              and parts[3] == "apis" and parts[4] in api_resources
                              and parts[5] == "productApiInformation.json")
              if (relative.is_absolute() or relative.as_posix() != path
                      or any(part in (".", "..") for part in parts)
                      or any(character in path for character in ("\0", "\n", "\r", "\\"))
                      or (path not in required and not product_file)):
                  fail(f"Preparation reported an out-of-scope path: {path!r}")
              destination = root / relative
              if not destination.resolve().is_relative_to(root) or not destination.is_file():
                  fail(f"Preparation reported a missing or escaped file: {path!r}")
          if not required.issubset(paths):
              fail("Preparation manifest omits required specifications, API metadata, version set or environment overrides.")

          # NUL separation preserves spaces and literal Git pathnames without quote interpretation.
          written_list = Path(os.environ["GITHUB_WORKSPACE"]) / "written-paths.txt"
          written_list.write_bytes(b"".join(path.encode("utf-8") + b"\0" for path in paths))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path_list={written_list}\n")
          PY

      - name: Commit on a branch of its own
        id: commit
        shell: bash
        working-directory: target-repo
        env:
          API_NAME: ${{ inputs.API_NAME }}
          PATH_LIST: ${{ steps.prepare.outputs.path_list }}
        run: |
          set -euo pipefail

          # The specification is regenerated on every run, and an unchanged one must not produce noise. Staging
          # first, then asking, is what makes "nothing changed" cheap to detect.
          git --literal-pathspecs add --pathspec-from-file="$PATH_LIST" --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The generated artifacts are identical to what is already in ${TARGET_FULL_NAME}. Nothing to propose."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-only > "$GITHUB_WORKSPACE/changed-paths.txt"

          # One long-lived branch per API, recreated from the default branch each run and force-pushed. A new
          # branch per build would give platform one pull request per team build, which nobody would read.
          # Recreating rather than committing on top keeps the diff to exactly one commit against main - and
          # stops a stale branch from conflicting once someone else edits the folder.
          #
          # The cost of the force-push is that review comments on a superseded commit go stale. That is the
          # right trade: what is under review is the current specification, not how it got there.
          branch="apim-spec/${API_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          git commit -m "chore(apim): update the ${API_NAME} specification" \
            -m "Generated by ${{ github.repository }} run ${{ github.run_id }} from commit ${{ github.sha }}."
          git push --force origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: pull-request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail

          # An open pull request on this branch already has the new commit - force-pushing updated it. So this
          # only has to create one when there is none.
          existing=$(gh pr list --repo "$TARGET_FULL_NAME" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')

          # Quoted heredoc: the body holds backticks and dollar signs that are markdown, not shell. Whatever has
          # to be interpolated is a workflow expression, substituted before bash ever sees the script.
          #
          # Do not write an empty pair of expression braces anywhere in a run block, not even in a comment -
          # the workflow parser evaluates it and rejects the file with "An expression was expected".
          body=$(cat <<'EOF'
          Generated by [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in `${{ github.repository }}`, from commit `${{ github.sha }}`.

          This Segment proposal contains generated specifications and, when changed, dated API metadata, version-set information, product associations and test/stage/prod environment overrides under the fixed apimartifacts convention. Backend paths follow `/api/<date>/<resource>`. Review the actual changed paths below; Query/Header version sets are rejected, never converted automatically.

          Merging publishes to test. Stage and prod follow behind their approval gates. Changes to environment override files require the full artifact-publish workflow and the applicable environment approvals, not a specification-only import.

          ### What to look at

          - Endpoints and models that were removed or renamed, since those break callers
          - Operation ids, which decide APIM's operation names - a rename orphans any operation-level policy
          - Whether the change deserves a new version date
          - Version-specific backend URLs in API metadata and every environment override
          - Product associations that inherit credential policies for a new version

          This branch is recreated on every run of the generating workflow, so it always holds the current specification as a single commit.
          EOF
          )

          body+=$'\n\n### Changed paths\n\n'
          while IFS= read -r path; do
            body+="- \`$path\`"$'\n'
          done < "$GITHUB_WORKSPACE/changed-paths.txt"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$TARGET_FULL_NAME" --body "$body"
            echo "url=$existing" >> "$GITHUB_OUTPUT"
            echo "Updated $existing"
            exit 0
          fi

          url=$(gh pr create \
            --repo "$TARGET_FULL_NAME" \
            --head "$BRANCH" \
            --title "chore(apim): update the ${{ inputs.API_NAME }} specification" \
            --body "$body")

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Specification proposed"
            echo ""
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| API | ${{ inputs.API_NAME }} |"
            echo "| Target | ${{ env.TARGET_FULL_NAME }} |"
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "| Pull request | ${{ steps.pull-request.outputs.url }} |"
              echo ""
              echo "### Changed paths"
              while IFS= read -r path; do
                printf -- '- `%s`\n' "$path"
              done < "$GITHUB_WORKSPACE/changed-paths.txt"
            else
              echo "| Pull request | none - no generated artifacts changed, or proposal did not complete (see step results) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
