# Opens a pull request against the platform repository with a generated OpenAPI specification.
#
# This is the supported way for a team to get its API into APIM. The team's build produces a specification;
# this workflow puts it in Git and asks for it to be merged. APIOps publishes from there, to test, then stage,
# then prod, through the same mechanism each time.
#
# Replaces apim-push-openapi-v2.yml as the normal path. That one writes straight to an APIM instance, which
# means the change has already happened by the time anyone can see it, and each environment would be written
# by a different mechanism. It is kept for bootstrapping a new instance and for recovery. See ADR-0008 and
# docs/apim-external-api/04-openapi-fra-ipc.md in the platform repository.
#
# The caller owns specifications. It never writes an API's identity - path, display name, backend, product
# membership, policy - and never spells out a resource name: those are composed here from the module name and
# the version date, so the naming rule lives in one place and no team can arrive at its own spelling.
#
# A new *version* is generated, because everything except the date is inherited from the version before it and
# nothing new is decided. A new *API* is not: its path, display name and product membership are a product
# decision, and a missing first version is an error with an instruction. That is the boundary - exposing an
# endpoint is a code change, exposing an API is a product decision.
#
# What the caller must have in place:
#
#   * A job that uploads an artifact named <API_NAME>-openapi. An API in a version set puts one file per
#     version in it, named <version>.json, and passes VERSIONS. An API that is not versioned puts a single
#     <API_NAME>-openapi.json in it and passes nothing.
#   * The APIM Spec Proposer GitHub App installed on the target repository, its app id passed as
#     GITHUB_APP_ID and its private key as the APIM_SPEC_PR_APP_PRIVATE_KEY secret.
#
# The app can propose and nothing more. It holds contents and pull-requests write, but the target's main is
# protected and apimartifacts/** has CODEOWNERS, so a person still decides what merges. Write access cannot
# be narrowed to a single path - GitHub App permissions are per repository - so branch protection, not the
# token, is what actually holds.

name: "[APIM] Propose specification to platform"

on:
  workflow_call:
    inputs:
      API_NAME:
        required: true
        type: string
        description: >-
          The module's name, without any version - e.g. project-controls. Resource names are composed from
          this and the version date, so a caller never spells out a combined name.
      GITHUB_APP_ID:
        required: true
        type: string
        description: "App id of the APIM Spec Proposer app. Pass vars.APIM_SPEC_PR_APP_ID"
      TARGET_REPOSITORY:
        required: false
        type: string
        default: "platform"
        description: "Repository name holding apimartifacts, without the owner. Override only for a dry run"
      ARTIFACT_FOLDER:
        required: false
        type: string
        default: "apimartifacts"
        description: "APIOps artifact folder in the target repository"
      VERSIONS:
        required: false
        type: string
        default: ""
        description: >-
          Space-separated version dates, e.g. "2026-06-01 2026-12-01". Each one is expected in the artifact as
          <version>.json, and its APIM resource name is composed as <API_NAME>--<version> per Rule 5b in
          ADR-0006. Leave empty for an API that is not in a version set; its specification is then expected as
          <API_NAME>-openapi.json.
    secrets:
      APIM_SPEC_PR_APP_PRIVATE_KEY:
        required: true
    outputs:
      pull_request_url:
        value: ${{ jobs.propose-spec.outputs.pull_request_url }}
        description: "The pull request, or empty when the specification was unchanged"

# The contended resource is the branch apim-spec/<API_NAME> in the target repository. Every run recreates it
# from the default branch and force-pushes, so two runs at once meant the one that finished last won - which
# is not the same as the one that started last. A slow run carrying an older specification could quietly
# overwrite a newer one, and nothing failed. The second run could also lose the race to create the pull
# request and fail on a conflict that said nothing about the specification.
#
# Cancelled rather than queued, unlike the publisher in platform: a superseded proposal has no value, and the
# newest specification is the one that should reach review. Nothing outside git is written here, so a run
# stopped midway leaves at worst a branch whose pull request the next run opens.
#
# Keyed per target repository and API, so two teams proposing different APIs never wait for each other.
concurrency:
  group: apim-spec-${{ inputs.TARGET_REPOSITORY }}-${{ inputs.API_NAME }}
  cancel-in-progress: true

jobs:
  propose-spec:
    name: Propose specification
    runs-on: ubuntu-latest

    # Nothing is read from or written to the calling repository. The specification arrives as an artifact from
    # an earlier job in the same run, and everything else happens in the target repository under the app token.
    permissions:
      contents: read

    outputs:
      pull_request_url: ${{ steps.pull-request.outputs.url }}

    env:
      TARGET_FULL_NAME: ${{ github.repository_owner }}/${{ inputs.TARGET_REPOSITORY }}

    steps:
      # Scoped to the target repository and to the two permissions actually used, rather than to everything
      # the installation holds. The token also expires with the run.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.GITHUB_APP_ID }}
          private-key: ${{ secrets.APIM_SPEC_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.TARGET_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Download the specification
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.API_NAME }}-openapi
          path: spec

      - name: Check out the target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_FULL_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          # The branch is recreated from the default branch on every run, so no older history is needed.
          fetch-depth: 1

      - name: Put the specification in place
        id: place
        shell: bash
        working-directory: target-repo
        env:
          API_NAME: ${{ inputs.API_NAME }}
          ARTIFACT_FOLDER: ${{ inputs.ARTIFACT_FOLDER }}
          VERSIONS: ${{ inputs.VERSIONS }}
        run: |
          set -euo pipefail

          apis="${ARTIFACT_FOLDER}/apis"

          # One path per line in a file, because "version sets" contains a space and a space-joined list of
          # paths cannot carry it. git add --pathspec-from-file reads the file as-is.
          written_list="$GITHUB_WORKSPACE/written-paths.txt"
          : > "$written_list"
          note() { printf '%s\n' "$1" >> "$written_list"; }

          # An unversioned API is the one-entry case of the same loop, so there is one code path rather than
          # two. A literal dash marks "no version": an empty field cannot be used, because read strips leading
          # whitespace and would shift the next field into it.
          entries="${VERSIONS:--}"

          # The newest existing member of the version set is what a new version inherits from. Newest rather
          # than any, so a version added today copies the most recent decisions about path and backend.
          template_dir=""
          for candidate in "$apis/${API_NAME}--"*; do
            [ -d "$candidate" ] && template_dir="$candidate"
          done

          for version in $entries; do
            if [ "$version" = "-" ]; then
              api="$API_NAME"
              source_file="$GITHUB_WORKSPACE/spec/${API_NAME}-openapi.json"
            else
              # A date and nothing else. A malformed version would otherwise create a folder named after the
              # mistake, and the mistake would reach APIM as an API.
              if ! printf '%s' "$version" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                echo "::error::'$version' is not a version date. Expected YYYY-MM-DD."
                exit 1
              fi

              # Composed here and nowhere else - Rule 5b in ADR-0006. A caller supplies the module name and
              # the date; if every caller spelled the combination out, every caller could spell it differently.
              api="${API_NAME}--${version}"
              source_file="$GITHUB_WORKSPACE/spec/${version}.json"
            fi

            target_dir="$apis/$api"
            target_file="$target_dir/specification.json"

            if [ ! -s "$source_file" ]; then
              echo "::error::No specification at $source_file. The export job produced nothing for ${version}."
              exit 1
            fi

            if [ ! -d "$target_dir" ]; then
              # A new version, not a new API. Everything except the date is inherited from the version before
              # it - path, display name, backend, protocols, product membership - so nothing is decided here
              # that a person has not already decided once. That is what makes generating it safe.
              #
              # A first version has nothing to inherit from, and its path and display name are a product
              # decision. So that stays an error with an instruction.
              if [ "$version" = "-" ] || [ -z "$template_dir" ]; then
                echo "::error::$target_dir does not exist in $TARGET_FULL_NAME, and there is no existing version of $API_NAME to inherit from. The first version of an API needs its path, display name and product membership decided - open a pull request against $TARGET_FULL_NAME. See docs/apim-external-api/04-openapi-fra-ipc.md."
                exit 1
              fi

              echo "New version $version - inheriting from $(basename "$template_dir")"
              mkdir -p "$target_dir"

              jq --arg v "$version" --arg set "/apiVersionSets/$API_NAME" '
                .properties.apiVersion = $v
                | .properties.apiVersionSetId = $set
                | del(.properties.apiVersionDescription)
              ' "$template_dir/apiInformation.json" > "$target_dir/apiInformation.json"
              note "$target_dir/apiInformation.json"

              # Same products as the version it inherits from. Without this the new version inherits no
              # policy, and every call to it fails on a credential exchange that never runs.
              for product_link in "${ARTIFACT_FOLDER}/products/"*"/apis/$(basename "$template_dir")"; do
                [ -d "$product_link" ] || continue
                new_link="$(dirname "$product_link")/$api"
                mkdir -p "$new_link"
                echo '{}' > "$new_link/productApiInformation.json"
                note "$new_link/productApiInformation.json"
                echo "  linked to product $(basename "$(dirname "$(dirname "$product_link")")")"
              done
            fi

            cp "$source_file" "$target_file"
            note "$target_file"
            echo "Wrote $target_file ($(wc -c < "$target_file") bytes)"
          done

          # The version set groups the members and carries the scheme. Derivable in full from the module name
          # and an existing member, so it is created rather than waited for - a team adding a version should
          # not need a platform pull request first.
          if [ -n "$VERSIONS" ]; then
            set_dir="${ARTIFACT_FOLDER}/version sets/${API_NAME}"
            if [ ! -d "$set_dir" ]; then
              if [ -z "$template_dir" ]; then
                echo "::error::No version set for $API_NAME and no existing version to take a display name from."
                exit 1
              fi
              echo "Creating version set $API_NAME"
              mkdir -p "$set_dir"
              jq -n --arg name "$(jq -r '.properties.displayName' "$template_dir/apiInformation.json")" '
                {properties: {displayName: $name, versioningScheme: "Query", versionQueryName: "version"}}
              ' > "$set_dir/versionSetInformation.json"
              note "$set_dir/versionSetInformation.json"
            fi
          fi

          # A list of paths, never a wildcard: git add on the whole folder would also stage anything else
          # that happened to differ, and this branch must contain what was generated and nothing besides.
          echo "Paths staged for commit:"
          sed 's/^/  /' "$written_list"
          echo "path_list=$written_list" >> "$GITHUB_OUTPUT"

      - name: Commit on a branch of its own
        id: commit
        shell: bash
        working-directory: target-repo
        env:
          API_NAME: ${{ inputs.API_NAME }}
          PATH_LIST: ${{ steps.place.outputs.path_list }}
        run: |
          set -euo pipefail

          # The specification is regenerated on every run, and an unchanged one must not produce noise. Staging
          # first, then asking, is what makes "nothing changed" cheap to detect.
          git add --pathspec-from-file="$PATH_LIST"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The specification is identical to what is already in ${TARGET_FULL_NAME}. Nothing to propose."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # One long-lived branch per API, recreated from the default branch each run and force-pushed. A new
          # branch per build would give platform one pull request per team build, which nobody would read.
          # Recreating rather than committing on top keeps the diff to exactly one commit against main - and
          # stops a stale branch from conflicting once someone else edits the folder.
          #
          # The cost of the force-push is that review comments on a superseded commit go stale. That is the
          # right trade: what is under review is the current specification, not how it got there.
          branch="apim-spec/${API_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          git commit -m "chore(apim): update the ${API_NAME} specification" \
            -m "Generated by ${{ github.repository }} run ${{ github.run_id }} from commit ${{ github.sha }}."
          git push --force origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: pull-request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail

          # An open pull request on this branch already has the new commit - force-pushing updated it. So this
          # only has to create one when there is none.
          existing=$(gh pr list --repo "$TARGET_FULL_NAME" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')

          if [ -n "$existing" ]; then
            echo "url=$existing" >> "$GITHUB_OUTPUT"
            echo "Updated $existing"
            exit 0
          fi

          # Quoted heredoc: the body holds backticks and dollar signs that are markdown, not shell. Whatever has
          # to be interpolated is a workflow expression, substituted before bash ever sees the script.
          #
          # Do not write an empty pair of expression braces anywhere in a run block, not even in a comment -
          # the workflow parser evaluates it and rejects the file with "An expression was expected".
          body=$(cat <<'EOF'
          Generated by [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in `${{ github.repository }}`, from commit `${{ github.sha }}`.

          Only `${{ inputs.ARTIFACT_FOLDER }}/apis/${{ inputs.API_NAME }}/specification.json` is touched. The API's path, display name, product membership and policy are not in this diff.

          Merging publishes to test. Stage and prod follow behind their approval gates.

          ### What to look at

          - Endpoints and models that were removed or renamed, since those break callers
          - Operation ids, which decide APIM's operation names - a rename orphans any operation-level policy
          - Whether the change deserves a new version date

          This branch is recreated on every run of the generating workflow, so it always holds the current specification as a single commit.
          EOF
          )

          url=$(gh pr create \
            --repo "$TARGET_FULL_NAME" \
            --head "$BRANCH" \
            --title "chore(apim): update the ${{ inputs.API_NAME }} specification" \
            --body "$body")

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Specification proposed"
            echo ""
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| API | ${{ inputs.API_NAME }} |"
            echo "| Target | ${{ env.TARGET_FULL_NAME }} |"
            echo "| File | ${{ inputs.ARTIFACT_FOLDER }}/apis/${{ inputs.API_NAME }}/specification.json |"
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "| Pull request | ${{ steps.pull-request.outputs.url }} |"
            else
              echo "| Pull request | none - the specification was unchanged |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
