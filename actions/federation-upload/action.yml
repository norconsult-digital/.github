name: Upload native-federation remote
description: >
  Uploads a native-federation remote bundle to a public remotes blob container.
  Content-hashed chunks go up first as immutable (1y cache), then the no-cache
  pointer file(s) are uploaded LAST — so no client can load a new
  remoteEntry.json before its chunks exist. Optionally scoped to a
  <container>/<path>/ virtual directory. Uploads only; stamping/GC are separate
  actions (federation-mark-stale / federation-gc).

inputs:
  account:
    description: Storage account name (e.g. stbimremotestest001).
    required: true
  container:
    description: Blob container to upload into (e.g. admin).
    required: true
  source:
    description: Path to the built remote bundle (the native-federation browser/ dir).
    required: true
  path:
    description: >
      Optional virtual-directory prefix inside the container (e.g. v1). When set,
      the upload is confined to <container>/<path>/. Empty = container root.
    required: false
    default: ""
  no-cache-files:
    description: >
      Comma-separated pointer FILENAMES served no-cache and uploaded AFTER all
      other files. Each is matched at ANY depth, so the default remoteEntry.json
      covers both v<version>/remoteEntry.json and the per-locale pointers of a
      localized build (v<version>/<locale>/remoteEntry.json). remoteEntry.json is
      the only correctness-critical pointer in a native-federation remote; add
      more filenames only if a build ships extra always-revalidate documents.
    required: false
    default: "remoteEntry.json"

runs:
  using: composite
  steps:
    - name: Upload bundle (immutable chunks first, no-cache pointers last)
      shell: bash
      env:
        ACCOUNT: ${{ inputs.account }}
        CONTAINER: ${{ inputs.container }}
        SOURCE: ${{ inputs.source }}
        DEST_PATH: ${{ inputs.path }}
        NO_CACHE: ${{ inputs.no-cache-files }}
      run: |
        set -euo pipefail

        if [ ! -d "${SOURCE}" ]; then
          echo "::error::Source directory '${SOURCE}' does not exist"
          exit 1
        fi

        # Optional virtual-directory prefix (e.g. v1). Strip any trailing slash.
        PREFIX="${DEST_PATH%/}"

        IFS=',' read -ra NC <<< "${NO_CACHE}"

        # no-cache-files are FILENAMES, matched at ANY depth. A native-federation
        # remote has exactly one correctness-critical pointer — remoteEntry.json —
        # and localized builds place one in each locale subdir (v1/nb/, v1/sv/ …).
        # All must bypass the immutable cache; hashed chunks never share the name.
        NC_PATHS=()
        for f in "${NC[@]}"; do
          [ -z "${f}" ] && continue
          matched=0
          while IFS= read -r p; do
            [ -n "${p}" ] && NC_PATHS+=("${p}") && matched=1
          done < <( cd "${SOURCE}" && find . -type f -name "${f}" -printf '%P\n' )
          # A no-cache pointer that matches nothing means the bundle is missing
          # the file (e.g. remoteEntry.json absent) — it would otherwise slip into
          # the immutable batch unnoticed. Warn, but don't fail: a variant build
          # legitimately may not contain every listed filename.
          [ "${matched}" -eq 0 ] && echo "::warning::no-cache file '${f}' matched no files under '${SOURCE}' — nothing to serve no-cache for it"
        done

        # Stage a copy of the build with the no-cache files removed, so the
        # immutable batch never touches them. The pointer(s) are then uploaded
        # explicitly last — guaranteeing every referenced chunk exists first.
        STAGE="$(mktemp -d "${RUNNER_TEMP:-/tmp}/federation-upload.XXXXXX")"
        trap 'rm -rf "${STAGE}"' EXIT
        cp -r "${SOURCE}/." "${STAGE}/"
        for p in "${NC_PATHS[@]:-}"; do
          [ -z "${p}" ] && continue
          rm -f "${STAGE}/${p}"
        done

        DEST_URL="https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}${PREFIX:+/${PREFIX}}"
        echo "Uploading immutable assets to ${ACCOUNT}/${CONTAINER}${PREFIX:+/${PREFIX}}"
        if command -v azcopy > /dev/null; then
          # azcopy uploads files in parallel; `az storage blob upload-batch`
          # uploads one file at a time, which took minutes for a localized
          # bundle. AZCLI login reuses the session from azure/login, and the
          # Content-Type is guessed from the extension like the az CLI does.
          AZCOPY_AUTO_LOGIN_TYPE=AZCLI azcopy copy "${STAGE}/*" "${DEST_URL}" \
            --recursive \
            --overwrite=true \
            --cache-control "public, max-age=31536000, immutable" \
            --log-level=WARNING \
            --output-level=essential
        else
          echo "::warning::azcopy not found, falling back to az storage blob upload-batch (slow)"
          batch_args=(
            --account-name "${ACCOUNT}"
            --auth-mode login
            --destination "${CONTAINER}"
            --source "${STAGE}"
            --overwrite
            --content-cache-control "public, max-age=31536000, immutable"
            --output none
          )
          [ -n "${PREFIX}" ] && batch_args+=(--destination-path "${PREFIX}")
          az storage blob upload-batch "${batch_args[@]}"
        fi
        ( cd "${STAGE}" && find . -type f -printf '%P\n' ) | sort \
          | sed "s#^#  uploaded: ${PREFIX:+${PREFIX}/}#"

        echo "Uploading no-cache pointer(s) last"
        for p in "${NC_PATHS[@]:-}"; do
          [ -z "${p}" ] && continue
          echo "  uploaded: ${PREFIX:+${PREFIX}/}${p} (no-cache)"
          az storage blob upload \
            --account-name "${ACCOUNT}" \
            --auth-mode login \
            --container-name "${CONTAINER}" \
            --name "${PREFIX:+${PREFIX}/}${p}" \
            --file "${SOURCE}/${p}" \
            --overwrite \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --output none
        done
