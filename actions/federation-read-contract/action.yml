name: Read federation contract
description: >
  Reads and validates a remote project's contract.json — the checked-in standard
  that declares the remote's product, module, name and integer contract version —
  and echoes each field for downstream steps. Extractor only; it does not decide
  how the fields are used. Full contract diffing (schema, name-vs-remoteEntry
  match) is the job of federation-verify, which runs first in the pipeline.

  Outputs:
    product         — the product field from contract.json (e.g. bim)
    module          — the module field from contract.json (e.g. admin)
    name            — the name field from contract.json (e.g. admin-app)
    contractVersion — the integer contract version (e.g. 1)

inputs:
  project-dir:
    description: Remote project root containing contract.json (monorepo support).
    required: false
    default: .

outputs:
  product:
    description: The product field from contract.json (e.g. bim).
    value: ${{ steps.read.outputs.product }}
  module:
    description: The module field from contract.json (e.g. admin).
    value: ${{ steps.read.outputs.module }}
  name:
    description: The name field from contract.json (e.g. admin-app).
    value: ${{ steps.read.outputs.name }}
  contractVersion:
    description: The integer contract version from contract.json (e.g. 1).
    value: ${{ steps.read.outputs.contractVersion }}

runs:
  using: composite
  steps:
    - name: Read contract.json
      id: read
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        set -euo pipefail

        CONTRACT="${PROJECT_DIR%/}/contract.json"
        if [ ! -f "${CONTRACT}" ]; then
          echo "::error::contract.json not found at '${CONTRACT}'"
          exit 1
        fi

        # `// ""` collapses a missing/JSON-null key to empty so the regexes below
        # reject it (jq -r would otherwise emit the literal "null", which happens
        # to pass the kebab-case check).
        PRODUCT=$(jq -r '.product // ""' "${CONTRACT}")
        MODULE=$(jq -r '.module // ""' "${CONTRACT}")
        NAME=$(jq -r '.name // ""' "${CONTRACT}")
        VER=$(jq -r '.contractVersion // ""' "${CONTRACT}")

        # Validate before any downstream step builds a registry path from these,
        # otherwise a bad value propagates as a null segment and silently
        # mis-publishes or mis-retires. Rules mirror federation-verify's contract
        # schema (kebab-case product/module/name, positive integer version) so
        # the readers agree.
        for pair in "product:${PRODUCT}" "module:${MODULE}" "name:${NAME}"; do
          field="${pair%%:*}"
          value="${pair#*:}"
          if ! printf '%s' "${value}" | grep -Eq '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'; then
            echo "::error::contract.json '${field}' is missing or invalid ('${value}'); expected kebab-case, e.g. orders-remote"
            exit 1
          fi
        done
        if ! printf '%s' "${VER}" | grep -Eq '^[1-9][0-9]*$'; then
          echo "::error::contract.json 'contractVersion' is missing or invalid ('${VER}'); expected a positive integer"
          exit 1
        fi

        {
          echo "product=${PRODUCT}"
          echo "module=${MODULE}"
          echo "name=${NAME}"
          echo "contractVersion=${VER}"
        } >> "$GITHUB_OUTPUT"
        echo "Contract: product=${PRODUCT} module=${MODULE} name=${NAME} contractVersion=${VER}"
