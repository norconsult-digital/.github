name: Publish native-federation remote
description: >
  Orchestrates the versioned-registry publish flow for a native-federation
  remote: resolves the contract module + version, logs in to Azure (OIDC), uploads
  the built bundle dir into its v<version>/ virtual directory (federation-upload)
  and stamps that version's orphaned blobs stale for deferred GC
  (federation-mark-stale). Keeps the CD workflow's per-environment jobs to a
  single step each.

  Takes an on-disk bundle dir (source), not an artifact name: artifact transport
  is the caller's concern (one actions/download-artifact step). In a split CD job
  that same step already feeds federation-verify, so publish never re-downloads;
  in a single build+publish job, pass the build output (e.g. dist/browser)
  directly.

  The blob container is derived from contract.json's module — the same value
  federation-verify reads. Versioned layout produced in the container:
    <module>/v<version>/remoteEntry.json   (no-cache pointer)
    <module>/v<version>/<hashed chunks>     (immutable, 1y cache)

inputs:
  source:
    description: >
      Path to the built native-federation bundle dir to publish (the browser/
      output, e.g. dist/browser, or a dir you downloaded from a build artifact).
      Uploaded as-is.
    required: true
  project-dir:
    description: >
      Remote project root containing contract.json. The version segment
      (v<contractVersion>) is derived from it via the federation-read-contract action.
    required: true
  account:
    description: Remotes storage account name (e.g. stbimremotestest001).
    required: true
  client-id:
    description: Azure service principal client id for OIDC login.
    required: true
  tenant-id:
    description: Azure tenant id.
    required: true
  subscription:
    description: Azure subscription id.
    required: true

runs:
  using: composite
  steps:
    - name: Read contract
      id: contract
      uses: $/actions/federation-read-contract
      with:
        project-dir: ${{ inputs.project-dir }}

    - name: Azure login (OIDC)
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription }}

    - name: Upload bundle
      uses: $/actions/federation-upload
      with:
        account: ${{ inputs.account }}
        container: ${{ steps.contract.outputs.module }}
        source: ${{ inputs.source }}
        path: v${{ steps.contract.outputs.contractVersion }}

    - name: Mark orphaned blobs stale (deferred GC)
      uses: $/actions/federation-mark-stale
      with:
        account: ${{ inputs.account }}
        container: ${{ steps.contract.outputs.module }}
        path: v${{ steps.contract.outputs.contractVersion }}
        source: ${{ inputs.source }}
